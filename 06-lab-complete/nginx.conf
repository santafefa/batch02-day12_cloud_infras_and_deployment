worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream agent_backend {
        # Docker Compose will resolve 'agent' to the service's IP
        # and automatically load balance across its instances.
        server agent:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://agent_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Health check endpoint for Nginx to monitor agent instances
        location /health {
            proxy_pass http://agent_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }
}